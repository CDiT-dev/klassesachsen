server {
	listen 8080;
	root /usr/share/nginx/html;
	index index.html;
	access_log off;           # no access logs: privacy page says so
	server_tokens off;

	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy no-referrer always;
	add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; worker-src 'self'; manifest-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

	location = /service-worker.js { expires -1; try_files $uri =404; }
	location = /manifest.webmanifest { default_type application/manifest+json; expires -1; }
	location /_app/immutable/ { expires max; }
	location / { try_files $uri $uri/ $uri.html =404; expires -1; }
}
